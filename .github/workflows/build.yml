name: Build

# Pull requests, the nightly run and releases: Linux build and tests, Windows
# build (the zip), and the tests under AddressSanitizer/UndefinedBehaviorSanitizer.
# Branches are tested through their pull request. After a merge, main gets only
# the Linux build and tests as a quick check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # draft pull requests skip this workflow; ready_for_review starts it
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  # release.yml runs this workflow before it publishes
  workflow_call:

# a new push to a pull request cancels the older run of that pull request;
# every other run (main, nightly, release) has a group of its own and is never
# cancelled or held back
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# the build only reads the code; artifacts are uploaded with the job's own token
permissions:
  contents: read

jobs:
  # pull requests that only change text (Markdown, docs/, licence files) or only the
  # website (issue templates, pages.yml, tools/site/) skip the build; a skipped job
  # counts as passed for the required checks. The rule is tools/ci/changes.py.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does the change touch more than text?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then printf 'code=true\nsite=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$DRAFT" = "true" ]; then printf 'code=false\nsite=false\n' >> "$GITHUB_OUTPUT"; echo "Draft pull request: skipped until it is marked ready."; exit 0; fi
          # any error here (git or the script) means the full build, never a silent skip
          if files=$(git diff --name-only "$BASE...$HEAD") && result=$(printf '%s\n' "$files" | python3 tools/ci/changes.py); then
            echo "$result" | grep -E '^(code|site)=' >> "$GITHUB_OUTPUT"
            echo "$result"
          else
            echo "Could not decide: running everything."
            printf 'code=true\nsite=true\n' >> "$GITHUB_OUTPUT"
          fi

  # the website builder's tests (pages.yml runs them again before it publishes);
  # not a required check
  website:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests for the page builder and the website pages
        run: |
          python3 tests/test_build_status.py
          for t in tests/test_site_*.py; do [ -e "$t" ] || continue; echo "== $t"; python3 "$t"; done

  windows:
    needs: changes
    # not after a merge to main (the quick check there is the Linux job)
    if: needs.changes.outputs.code == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    env:
      # compiler cache (see "Compile faster" in docs/DEV.md): an object is reused only when compiler,
      # flags and source text are identical. The build number and time go into a generated header that
      # only constants.cpp includes, so the real run number can stay in the zip and the cache still hits.
      CCACHE_DIR: C:\ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      # the files exactly as in the repository (LF line ends, as on Linux): the tests compare
      # generated files byte for byte with the checked-in ones
      - name: No line-end conversion on checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'  # Qt 6.12 repo layout; switch back to a PyPI release when one supports it
          version: '6.12.0'
          arch: win64_mingw
          tools: 'tools_mingw1310'
          # keeps the Qt and MinGW installation between runs (the cache is scoped to the branch)
          cache: true
      - name: Install ccache
        # the Chocolatey package is pinned to one version; Ninja is part of the runner image
        shell: bash
        run: |
          choco install ccache --version=4.10.2 --no-progress -y
          ccache --version | head -1
          ninja --version
      - name: Cache compiler output (ccache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: C:\ccache
          key: ccache-windows-${{ hashFiles('**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-${{ hashFiles('**/CMakeLists.txt') }}-
            ccache-windows-
      - name: Build
        shell: bash
        env:
          # shown in the window title; the branch name goes through the environment, never into the script text
          BUILD_SOURCE: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
          BUILD_COMMIT: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          export PATH="$IQTA_TOOLS/mingw1310_64/bin:$PATH"
          ccache --zero-stats
          # Ninja instead of MinGW Makefiles; the compilers are named so that CMake never picks a Visual Studio one from the runner's PATH
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DBUILD_NUMBER=${{ github.run_number }} "-DPINGLYMOTION_BUILD_SOURCE=$BUILD_SOURCE" "-DPINGLYMOTION_COMMIT=$BUILD_COMMIT" -DPINGLYMOTION_TESTS=ON
          # no -j: Ninja runs as many jobs as the runner has CPUs plus two (4 CPUs, 16 GB RAM)
          cmake --build build
          ccache --show-stats
          { echo '### Windows ccache'; echo '```'; ccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Automatic tests
        # the same ctest run as in the Linux job: each test sets QT_QPA_PLATFORM=offscreen itself
        # (tests/CMakeLists.txt), so no display is needed; Qt's DLLs are on PATH from install-qt-action
        shell: bash
        env:
          PINGLYMOTION_EXPECT_BUILD_SOURCE: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
          # the offscreen platform on Windows looks for fonts in Qt's own lib/fonts, which does not
          # exist; without fonts the labels drawn into screenshots differ from run to run
          QT_QPA_FONTDIR: 'C:\Windows\Fonts'
        run: |
          export PATH="$IQTA_TOOLS/mingw1310_64/bin:$PATH"
          # a failed test is run again with its Qt Test output written to a file, so the log shows why
          ctest --test-dir build --output-on-failure || { python tools/ci/rerun_failed_tests.py build; exit 1; }
      - name: Package
        shell: bash
        run: |
          export PATH="$IQTA_TOOLS/mingw1310_64/bin:$PATH"
          mkdir -p dist
          cp build/src/PinglyMotion.exe dist/
          cp -r bin/data dist/data
          cp bin/NEWS dist/
          # ONE folder examples/ next to the program holds every file the project owner may open: no
          # separate downloads; library/ goes next to the program. The release packages use the same script.
          bash tools/ci/package_examples.sh dist
          # the Claude Desktop extension (issue #7)
          python tools/mcp/build_mcpb.py dist/PinglyMotion.mcpb
          cp "tools/mcp/START_HERE_CLAUDE.txt" "dist/START HERE - Claude.txt"
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations dist/PinglyMotion.exe
          cp "$IQTA_TOOLS"/mingw1310_64/bin/{libgcc_s_seh-1,libstdc++-6,libwinpthread-1}.dll dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PinglyMotion-windows
          path: dist
      - name: Smoke run with screenshots (issue 129)
        # starts the packed program with remote control and opens every file in the zip's
        # examples/ folder that 'open_file' can open (.dingle, .bvh, .avm), recursively,
        # taking a picture after each; fails only when the program crashes or does not
        # answer (an empty picture, or a single file that fails to open, is reported, not
        # failed); the script ends a hung program after 8 minutes
        shell: bash
        timeout-minutes: 10
        run: python tools/ci/smoke_screenshots.py --app dist/PinglyMotion.exe --folder dist/examples --open-dir . --out smoke --timeout 480 --preview-width 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # the pictures and the report, also when the smoke run failed (then the report says why)
        if: always()
        with:
          name: PinglyMotion-windows-smoke
          path: smoke
          if-no-files-found: ignore

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # compiler cache: an object is reused only when compiler, flags and source text are identical
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache downloaded apt packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/apt-archives
          key: apt-linux-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-linux-
      - name: Install Qt 6
        run: |
          mkdir -p /home/runner/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives=/home/runner/apt-archives ccache qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-l10n-tools libqt6opengl6-dev libgl-dev xvfb
          sudo chown -R "$USER" /home/runner/apt-archives
      - name: Cache compiler output (ccache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.ccache
          key: ccache-linux-${{ hashFiles('**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ hashFiles('**/CMakeLists.txt') }}-
            ccache-linux-
      - name: Skeleton files match the generator
        run: |
          python3 tools/make_bento_skeleton.py
          git diff --exit-code bin/data
      - name: Build
        # this build is not shipped, so the build number and the build time are fixed:
        # they are compiler options, and a changing option would make every ccache lookup miss
        env:
          SOURCE_DATE_EPOCH: '0'
          # the same build source as the Windows zip ("PR #12"); it goes into a generated
          # header, so it does not spoil the ccache, and the buildinfo test checks it arrived
          BUILD_SOURCE: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
        run: |
          ccache --zero-stats
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_NUMBER=0 -DPINGLYMOTION_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "-DPINGLYMOTION_BUILD_SOURCE=$BUILD_SOURCE"
          cmake --build build -j 4
          ccache --show-stats
      - name: Automatic tests
        env:
          PINGLYMOTION_EXPECT_BUILD_SOURCE: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
        run: ctest --test-dir build --output-on-failure
      - name: Translations (warning only; docs/TRANSLATION.md)
        # texts without tr() in the source, and translations/pinglymotion_en.ts out of date: reported, never failed
        continue-on-error: true
        run: |
          python3 tests/test_check_tr.py
          python3 tools/check_tr.py --ts-sync build
      - name: MCP server (Node) connects safely (issue 7)
        run: node --version && python3 tests/test_mcp_node.py node
      - name: Claude Desktop extension (.mcpb) is correct
        run: python3 tests/test_mcpb.py
      - name: Generated edge-case animations are up to date
        run: python3 tests/test_gen_edge_bvh.py
      - name: Generated SOMA 77 test skeleton is up to date (issue 18)
        run: python3 tests/test_gen_soma77_bvh.py
      - name: Kimodo text-to-motion helper (issue 18)
        run: python3 tests/test_kimodo_helper.py
      - name: CI path filter decides which jobs run
        run: python3 tests/test_ci_changes.py
      - name: Auto-merge decides only on green required checks
        run: python3 tests/test_ci_auto_merge.py
      - name: Combined test build script refuses foreign pull requests (issue 245)
        run: python3 tests/test_update_combined.py
      - name: Generated SMPL 22 test skeletons are up to date (issue 18)
        run: python3 tests/test_gen_smpl22_bvh.py
      - name: Generated XR Animator test skeleton is up to date
        run: python3 tests/test_gen_xr_animator_bvh.py
      - name: Reference library index is valid
        run: python3 tests/test_reference_library.py
      - name: Generated .dingle and .anim edge cases are up to date
        run: python3 tests/test_gen_edge_motion.py
      - name: BVH comparer for the Blender round trip (issue 13)
        run: python3 tests/test_bvh_compare.py
      - name: Example files made by scripts are up to date (slow jump, wave)
        run: python3 tests/test_slow_example.py && python3 tests/test_wave_example.py
      - name: Exported BVH files pass Second Life's upload rules
        run: |
          cd bin
          PINGLYMOTION_EXPORT_DIR=$PWD/../exports QT_QPA_PLATFORM=offscreen ../build/tests/pinglymotion_tests > /dev/null
          cd ..
          python3 tools/check_sl_bvh.py exports/*.bvh
          python3 tools/check_sl_bvh.py exports/posed_bones.bvh --expect-animated mHandIndex2Left mHandThumb1Right mFaceJaw mTail2
      - name: Program starts and opens files
        run: xvfb-run -a -s "-screen 0 1280x1000x24" tests/smoke_gui.sh build/src/PinglyMotion
      - name: Remote control works from start to finish (HTTP and the Node MCP server)
        run: xvfb-run -a -s "-screen 0 1280x1000x24" python3 tests/smoke_control.py build/src/PinglyMotion
      - name: Evaluation set for the AI assistant, reference solutions (issue 129)
        # every prompt's acceptance checks pass for a scripted reference solution and fail for an
        # untouched animation; the manual driver (needs an API key, never run here) is tried on a fake API
        run: |
          xvfb-run -a -s "-screen 0 1280x1000x24" python3 tests/assistant/run_reference.py build/src/PinglyMotion
          xvfb-run -a -s "-screen 0 1280x1000x24" python3 tests/assistant/selftest_driver.py build/src/PinglyMotion
      - name: Golden clips are described sensibly (issue 129)
        run: xvfb-run -a -s "-screen 0 1280x1000x24" python3 tests/assistant/run_golden.py build/src/PinglyMotion
      - name: Smoke run with screenshots (issue 129)
        # the same run as in the Windows job, under Xvfb, but over every example and test-motion
        # file (recursively); fails only when the program crashes or does not answer
        timeout-minutes: 10
        run: xvfb-run -a -s "-screen 0 1280x1000x24" python3 tools/ci/smoke_screenshots.py --app build/src/PinglyMotion --cwd bin --folder . --open-dir examples --open-dir tests/motions --open-dir tests/data/generated --out smoke --timeout 480 --preview-width 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: PinglyMotion-linux-smoke
          path: smoke
          if-no-files-found: ignore

  asan-ubsan:
    needs: changes
    # not after a merge to main (the quick check there is the Linux job)
    if: needs.changes.outputs.code == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      # compiler cache: an object is reused only when compiler, flags and source text are identical
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache downloaded apt packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/apt-archives
          key: apt-asan-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-asan-
      - name: Install dependencies
        run: |
          mkdir -p /home/runner/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives=/home/runner/apt-archives ccache qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-l10n-tools libqt6opengl6-dev libgl-dev xvfb
          sudo chown -R "$USER" /home/runner/apt-archives
      - name: Cache compiler output (ccache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.ccache
          key: ccache-asan-${{ hashFiles('**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-asan-${{ hashFiles('**/CMakeLists.txt') }}-
            ccache-asan-
      - name: Configure and build with ASan/UBSan
        # -fno-sanitize-recover: any undefined behaviour stops the program, so a test cannot pass over it
        # build number and build time are fixed so that ccache can reuse objects (nothing is shipped from here)
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          ccache --zero-stats
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DPINGLYMOTION_TESTS=ON -DBUILD_NUMBER=0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize -j 2
          ccache --show-stats
      - name: Run tests under sanitizers
        run: xvfb-run -a -s "-screen 0 1280x1000x24" ctest --test-dir build-sanitize --output-on-failure
      - name: Program starts and opens files (under sanitizers)
        run: xvfb-run -a -s "-screen 0 1280x1000x24" tests/smoke_gui.sh build-sanitize/src/PinglyMotion
      - name: Remote control from start to finish (under sanitizers)
        run: xvfb-run -a -s "-screen 0 1280x1000x24" python3 tests/smoke_control.py build-sanitize/src/PinglyMotion
