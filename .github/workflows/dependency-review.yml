name: Dependency review
# Checks the dependencies a pull request adds or changes (here: GitHub Actions)
# against GitHub's advisory database before they are merged.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  dependency-review:
    # Code scanning and dependency review are not available on a free private repository.
    # The job is skipped while the repository is private and runs again if it is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
