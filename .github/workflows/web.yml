name: Web trial build

# The program for the browser (Qt for WebAssembly), the trial of the web version
# (docs/DEV.md, "The web trial build"). Started by hand (Actions > Web trial build >
# Run workflow), and on a pull request that changes this workflow or tools/web/.
# Never a required check: the desktop build does not depend on it.
# The result (the page, its .js, .wasm and .data files, a screenshot from headless
# Chromium and the console log) is kept as the artifact "pinglymotion-web".

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web.yml'
      - 'tools/web/**'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt for WebAssembly must be built with the Emscripten version its Qt release names
  # (Qt 6.12: Emscripten 5.0.5, doc.qt.io/qt-6.12/wasm.html); same Qt as build.yml
  QT_VERSION: '6.12.0'
  EMSDK_VERSION: '5.0.5'
  EMSDK_COMMIT: 'c9ef2c9d6000341d667a32a807ba47ca489d1e1b'
  AQT_VERSION: '3.3.0'
  PLAYWRIGHT_VERSION: '1.65.1'

defaults:
  run:
    # -o pipefail: a failing build is not hidden by tee
    shell: bash -eo pipefail {0}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Install Qt for WebAssembly (and the desktop Qt its tools need)
        run: |
          python3 -m pip install --quiet "aqtinstall==$AQT_VERSION"
          python3 -m aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread --autodesktop -O "$RUNNER_TEMP/Qt"
          # the all_os WebAssembly package does not keep the scripts' run permission
          chmod +x "$RUNNER_TEMP/Qt/$QT_VERSION"/wasm_singlethread/bin/*
          ls "$RUNNER_TEMP/Qt/$QT_VERSION"

      - name: Install Emscripten
        run: |
          git clone --quiet https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout --quiet "$EMSDK_COMMIT"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Configure
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version | head -1
          "$RUNNER_TEMP/Qt/$QT_VERSION/wasm_singlethread/bin/qt-cmake" -S . -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPINGLYMOTION_WEB=ON "-DQT_HOST_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64" \
            -DBUILD_NUMBER=${{ github.run_number }} "-DPINGLYMOTION_BUILD_SOURCE=web ${GITHUB_REF_NAME}"

      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --build build-web --target pinglymotion 2>&1 | tee build-web.log
          ls -la build-web/src

      - name: Start in headless Chromium
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y --silent > /dev/null
          npm install --silent --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          # the script runs from the folder with node_modules, so it finds playwright
          cp tools/web/smoke.mjs "$RUNNER_TEMP/pw/smoke.mjs"
          node "$RUNNER_TEMP/pw/smoke.mjs" build-web/src web-smoke 90

      - name: Collect the web build
        if: always()
        run: |
          mkdir -p web-out
          cp build-web/src/PinglyMotion.html build-web/src/PinglyMotion.js build-web/src/PinglyMotion.wasm \
             build-web/src/PinglyMotion.data build-web/src/qtloader.js web-out/ 2>/dev/null || true
          cp build-web/src/*.svg web-out/ 2>/dev/null || true
          cp -r web-smoke web-out/ 2>/dev/null || true
          cp build-web.log web-out/ 2>/dev/null || true
          cat > web-out/README.txt <<'TXT'
          PinglyMotion web trial build. A browser cannot open the page from a file:
          start a small web server in this folder (for example: python3 -m http.server 8000)
          and open http://localhost:8000/PinglyMotion.html in a browser with WebGL 2.
          web-smoke/ holds the screenshot and console log from the automatic start in headless Chromium.
          TXT
          ls -la web-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pinglymotion-web
          path: web-out
          retention-days: 30

      - name: Result
        if: always()
        run: |
          echo "## Web trial build" >> "$GITHUB_STEP_SUMMARY"
          echo "Start in headless Chromium: ${{ steps.smoke.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f web-smoke/console.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 web-smoke/console.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
