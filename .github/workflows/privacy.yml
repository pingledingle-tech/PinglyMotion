name: Privacy

# Stops personal names and email addresses from entering the repository.
# See tools/check_privacy.py. Issues and comments: privacy-text.yml.
on:
  pull_request:
    branches: [main]
    # edited: the title or description changed
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tests for the privacy check
        run: python3 tests/test_check_privacy.py
      # only while the pull request is open: after a merge the branch is deleted and
      # its commits cannot be fetched, but editing the description still starts this
      - name: No personal data in commits or added lines
        if: github.event.pull_request.state == 'open'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_privacy.py "$BASE" "$HEAD"
      # the title and description are read from the event file, never passed
      # through the command line or env, so they do not appear in the log
      - name: No personal data in the pull request title or description
        if: ${{ !cancelled() }}
        run: python3 tools/check_privacy.py --event "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH"
      # the old project name must not come back (tools/check_old_name.py)
      - name: Tests for the old name check
        if: ${{ !cancelled() }}
        run: python3 tests/test_check_old_name.py
      - name: No old project name in files
        if: ${{ !cancelled() && github.event.pull_request.state != 'open' }}
        run: python3 tools/check_old_name.py
      - name: No old project name in files or commit messages
        if: ${{ !cancelled() && github.event.pull_request.state == 'open' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_old_name.py "$BASE" "$HEAD"
      # teaching texts (issue 54): a warning only, it does not fail the check yet
      - name: Check the teaching texts (warning only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 tests/test_check_texts.py
          python3 tools/check_texts.py
