name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    # Code scanning and dependency review are not available on a free private repository.
    # The job is skipped while the repository is private and runs again if it is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # text-only pull requests (Markdown, docs/, licence files) have nothing to analyse.
      # The job still runs and passes quickly, so the required "analyze" checks are reported.
      # (paths-ignore would skip the whole workflow and leave the required checks waiting.)
      - name: Does the change touch more than text?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          other=$(git diff --name-only "$BASE...$HEAD" | grep -vE '(\.md$|^docs/|^LICENSE$|^COPYING$|^INSTALL$)' || true)
          if [ -n "$other" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          echo "Files other than text:"; echo "${other:-(none)}"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.diff.outputs.code == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # the security queries plus the extra ones with more false positives
          queries: security-extended
      - name: Install C++ build dependencies
        if: steps.diff.outputs.code == 'true' && matrix.language == 'cpp'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev libgl-dev
      - name: Build for C++ analysis
        if: steps.diff.outputs.code == 'true' && matrix.language == 'cpp'
        # the tests are built too, so their code is analysed as well
        run: |
          cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Debug -DPINGMATOR_TESTS=ON
          cmake --build build-codeql -j 2
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.diff.outputs.code == 'true'
        with:
          category: /language:${{ matrix.language }}
