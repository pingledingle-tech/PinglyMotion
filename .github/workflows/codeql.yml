name: CodeQL
# Pull requests: the program's C++ code, the Python tools and the workflows.
# The nightly run and releases also analyse the C++ test code (the test
# programs compile the same sources again, once per test program).
on:
  pull_request:
    branches: [main]
    # draft pull requests pass quickly without analysis; ready_for_review starts it
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # release.yml runs this workflow before it publishes
  workflow_call:

# a new push to a pull request cancels the older run of that pull request;
# every other run (main, nightly, release) has a group of its own and is never
# cancelled or held back
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  codeql:
    # Code scanning and dependency review are not available on a free private repository.
    # The job is skipped while the repository is private and runs again if it is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # Pull requests build only the program (longest green run 22 minutes: 45 is about twice that).
    # Nightly, manual and release runs also build the test code (longest green run 37 minutes, and
    # growing): 90 is more than twice that. Rule: docs/DEV.md, "Time limits".
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 90 }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Pull requests analyse only the languages they change: C++ when the program
      # may have changed, Python when a .py file changed, the workflows when a file
      # under .github/workflows/ or .github/actions/ changed; drafts analyse nothing
      # yet. The rule is tools/ci/changes.py. Nightly, manual and release runs
      # analyse everything.
      # The job still runs and passes quickly, so the required "analyze" check is reported.
      # (paths-ignore would skip the whole workflow and leave the required check waiting.)
      - name: Does the change touch more than text?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$DRAFT" = "true" ]; then echo "code=false" >> "$GITHUB_OUTPUT"; echo "Draft pull request: analysed when it is marked ready."; exit 0; fi
          # any error here (git or the script) means the analysis runs, never a silent skip
          if files=$(git diff --name-only "$BASE...$HEAD") && result=$(printf '%s\n' "$files" | python3 tools/ci/changes.py); then
            echo "$result"
            # C++: when the program may have changed; Python: when a .py file changed;
            # workflows: when a workflow or action file changed
            case "$LANGUAGE" in cpp) key=code ;; python) key=python ;; actions) key=actions ;; *) key=analyze ;; esac
            value=$(echo "$result" | sed -n "s/^$key=//p")
            if [ "$value" = "false" ]; then echo "code=false" >> "$GITHUB_OUTPUT"; else echo "code=true" >> "$GITHUB_OUTPUT"; fi
          else
            echo "Could not decide: analysing."
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.diff.outputs.code == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # the security queries plus the extra ones with more false positives
          queries: security-extended
      - name: Cache downloaded apt packages
        if: steps.diff.outputs.code == 'true' && matrix.language == 'cpp'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/apt-archives
          key: apt-codeql-${{ hashFiles('.github/workflows/codeql.yml') }}
          restore-keys: apt-codeql-
      - name: Install C++ build dependencies
        if: steps.diff.outputs.code == 'true' && matrix.language == 'cpp'
        run: |
          mkdir -p /home/runner/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives=/home/runner/apt-archives qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev libgl-dev
          sudo chown -R "$USER" /home/runner/apt-archives
      - name: Build for C++ analysis
        if: steps.diff.outputs.code == 'true' && matrix.language == 'cpp'
        # pull requests: the program only; nightly, manual and release runs: the tests too
        env:
          TESTS: ${{ github.event_name == 'pull_request' && 'OFF' || 'ON' }}
        run: |
          cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Debug -DPINGLYMOTION_TESTS="$TESTS"
          cmake --build build-codeql -j 4
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.diff.outputs.code == 'true'
        with:
          category: /language:${{ matrix.language }}

  # Nightly and manual runs: list the open alerts, so a session can read them
  # (its own token gets 403 on the alert lists). One log line per alert,
  # "ALERT #<number> <severity> <rule> <file>:<line>", and a table in the run
  # summary. Read-only token; it never dismisses or changes an alert. A list it
  # cannot read is reported as "NOT READ", never as "no alerts". Runs after the
  # analysis so the list includes tonight's results. Rule: CLAUDE.md, "The job queue".
  alerts:
    needs: codeql
    if: ${{ always() && !github.event.repository.private && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: read
    steps:
      - name: List open security alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          code_scanning_failed=""
          echo "## Open security alerts" >> "$summary"
          if out=$(gh api --paginate "repos/$REPO/code-scanning/alerts?state=open&per_page=100" \
                --jq '.[] | "#\(.number)\t\(.rule.security_severity_level // .rule.severity // "unknown")\t\(.rule.id)\t\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' 2>/tmp/cs-error); then
            count=$(printf '%s' "$out" | grep -c . || true)
            echo "Code scanning: $count open alert(s) on the default branch"
            echo "Code scanning: $count open alert(s) on the default branch." >> "$summary"
            if [ "$count" -gt 0 ]; then
              printf '\n| Alert | Severity | Rule | File:line |\n|---|---|---|---|\n' >> "$summary"
              printf '%s\n' "$out" | while IFS="$(printf '\t')" read -r number severity rule where; do
                echo "ALERT $number $severity $rule $where"
                echo "| $number | $severity | \`$rule\` | \`$where\` |" >> "$summary"
              done
            fi
          else
            echo "NOT READ code scanning: $(head -c 300 /tmp/cs-error)"
            echo "Code scanning: NOT READ ($(head -c 300 /tmp/cs-error))." >> "$summary"
            code_scanning_failed=1
          fi
          # Dependabot and secret scanning: tried with the same read-only token; GitHub
          # may refuse both. A refusal is reported, it does not fail the run.
          for kind in dependabot secret-scanning; do
            if out=$(gh api --paginate "repos/$REPO/$kind/alerts?state=open&per_page=100" --jq '.[] | "#\(.number)"' 2>/tmp/other-error); then
              count=$(printf '%s' "$out" | grep -c . || true)
              echo "ALERTS $kind: $count open"
              echo "$kind: $count open alert(s): $(printf '%s' "$out" | tr '\n' ' ')" >> "$summary"
            else
              echo "NOT READ $kind: $(head -c 300 /tmp/other-error)"
              echo "$kind: NOT READ ($(head -c 300 /tmp/other-error))." >> "$summary"
            fi
          done
          # this job's token has security-events: read, so code scanning must be readable;
          # if it is not, the job fails so the gap is seen (Dependabot and secret scanning do not)
          if [ -n "${code_scanning_failed:-}" ]; then echo "::error::The open code scanning alerts could not be read."; exit 1; fi

  # The matrix above reports as "codeql (<language>, <build-mode>)" per combination,
  # so a branch ruleset cannot require it directly. This job reports under one
  # fixed name, "analyze", that the ruleset requires instead. It is skipped
  # automatically when the matrix is skipped (private repository), and fails if
  # any matrix combination failed.
  analyze:
    needs: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check CodeQL matrix result
        run: |
          echo "codeql matrix result: ${{ needs.codeql.result }}"
          [ "${{ needs.codeql.result }}" = "success" ]
