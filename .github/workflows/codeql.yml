name: CodeQL
# Pull requests: the program's C++ code, the Python tools and the workflows.
# The nightly run and releases also analyse the C++ test code (the test
# programs compile the same sources again, once per test program).
on:
  pull_request:
    branches: [main]
    # draft pull requests pass quickly without analysis; ready_for_review starts it
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # release.yml runs this workflow before it publishes
  workflow_call:

# a new push to a pull request cancels the older run of that pull request;
# every other run (main, nightly, release) has a group of its own and is never
# cancelled or held back
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  codeql:
    # Code scanning and dependency review are not available on a free private repository.
    # The job is skipped while the repository is private and runs again if it is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # text-only and draft pull requests have nothing to analyse yet.
      # The job still runs and passes quickly, so the required "analyze" check is reported.
      # (paths-ignore would skip the whole workflow and leave the required check waiting.)
      - name: Does the change touch more than text?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$DRAFT" = "true" ]; then echo "code=false" >> "$GITHUB_OUTPUT"; echo "Draft pull request: analysed when it is marked ready."; exit 0; fi
          other=$(git diff --name-only "$BASE...$HEAD" | grep -vE '(\.md$|^docs/|^LICENSE$|^COPYING$|^INSTALL$)' || true)
          if [ -n "$other" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          echo "Files other than text:"; echo "${other:-(none)}"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.diff.outputs.code == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # the security queries plus the extra ones with more false positives
          queries: security-extended
      - name: Cache downloaded apt packages
        if: steps.diff.outputs.code == 'true' && matrix.language == 'cpp'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/apt-archives
          key: apt-codeql-${{ hashFiles('.github/workflows/codeql.yml') }}
          restore-keys: apt-codeql-
      - name: Install C++ build dependencies
        if: steps.diff.outputs.code == 'true' && matrix.language == 'cpp'
        run: |
          mkdir -p /home/runner/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives=/home/runner/apt-archives qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev libgl-dev
          sudo chown -R "$USER" /home/runner/apt-archives
      - name: Build for C++ analysis
        if: steps.diff.outputs.code == 'true' && matrix.language == 'cpp'
        # pull requests: the program only; nightly, manual and release runs: the tests too
        env:
          TESTS: ${{ github.event_name == 'pull_request' && 'OFF' || 'ON' }}
        run: |
          cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Debug -DPINGLYMOTION_TESTS="$TESTS"
          cmake --build build-codeql -j 4
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.diff.outputs.code == 'true'
        with:
          category: /language:${{ matrix.language }}

  # The matrix above reports as "codeql (<language>, <build-mode>)" per combination,
  # so a branch ruleset cannot require it directly. This job reports under one
  # fixed name, "analyze", that the ruleset requires instead. It is skipped
  # automatically when the matrix is skipped (private repository), and fails if
  # any matrix combination failed.
  analyze:
    needs: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check CodeQL matrix result
        run: |
          echo "codeql matrix result: ${{ needs.codeql.result }}"
          [ "${{ needs.codeql.result }}" = "success" ]
