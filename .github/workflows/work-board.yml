name: Work board

# Warns when two active jobs claim the same files (docs/work/, tools/work.py).
# Not a required check. An overlap is shown as a yellow warning, not red
# (the project owner, 24 Nov 2026); the script's own tests still fail red.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  work-board:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tests for the work board script
        run: python3 tests/test_work.py
      - name: Tests for the weekly report script
        run: python3 tests/test_weekly_report.py
      - name: No overlapping jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! out=$(python3 tools/work.py check --mine 2>&1); then
            printf '%s\n' "$out"
            echo "::warning title=Work board::Two active jobs claim the same files. Look at the overlap; this does not block."
          else
            printf '%s\n' "$out"
          fi

  # Warning only: checks that the queue in the jobs list (issue 74) names no
  # merged or closed pull request. Read-only, never fails, never writes to GitHub.
  list-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Jobs list against reality (warnings only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/work.py check-lists --annotate || true

  # Warning only: a visible pull request must name the design charter
  # principles it follows (docs/DESIGN_CHARTER.md, CLAUDE.md). Never fails.
  charter-field:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests for the charter field check
        run: python3 tests/test_check_charter_field.py
      - name: Charter principles named (warnings only)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/check_charter_field.py || true
