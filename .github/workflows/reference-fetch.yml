name: reference-fetch

# Tests for tools/fetch_reference.py and tools/convert_reference.py, and a manual job that pins the hashes
# (the sandboxes of AI sessions cannot download, GitHub runners can).
on:
  pull_request:
    paths:
      - tools/fetch_reference.py
      - tools/reference_manifest.json
      - tests/test_fetch_reference.py
      - tools/convert_reference.py
      - tools/cmu_to_sl.py
      - tests/test_convert_reference.py
      - .github/workflows/reference-fetch.yml
  workflow_dispatch:
  push:
    branches: [job/fetch-reference]
    paths:
      - .github/workflows/reference-fetch.yml

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python tests/test_fetch_reference.py
      - run: python tests/test_convert_reference.py
  compute-hashes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin hashes
        env:
          # read-only token, only sent to api.github.com to list the pinned commits' files
          # (without it the API's rate limit for anonymous calls stops the job)
          GITHUB_TOKEN: ${{ github.token }}
          PIN_PRINT: '1'
        run: python3 tools/fetch_reference.py --compute-hashes --out reference_manifest.new.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-manifest
          path: reference_manifest.new.json
