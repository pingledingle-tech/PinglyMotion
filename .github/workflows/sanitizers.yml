name: Sanitizers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # draft pull requests skip this workflow; ready_for_review starts it
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# a new push to a pull request cancels the older run; runs on main are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  # pull requests that only change text (Markdown, docs/, licence files) skip the build;
  # a skipped job counts as passed for the required checks
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does the change touch more than text?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$DRAFT" = "true" ]; then echo "code=false" >> "$GITHUB_OUTPUT"; echo "Draft pull request: skipped until it is marked ready."; exit 0; fi
          other=$(git diff --name-only "$BASE...$HEAD" | grep -vE '(\.md$|^docs/|^LICENSE$|^COPYING$|^INSTALL$)' || true)
          if [ -n "$other" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          echo "Files other than text:"; echo "${other:-(none)}"

  asan-ubsan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      # compiler cache: an object is reused only when compiler, flags and source text are identical
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache downloaded apt packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/apt-archives
          key: apt-asan-${{ hashFiles('.github/workflows/sanitizers.yml') }}
          restore-keys: apt-asan-
      - name: Install dependencies
        run: |
          mkdir -p /home/runner/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives=/home/runner/apt-archives ccache qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev libgl-dev xvfb
          sudo chown -R "$USER" /home/runner/apt-archives
      - name: Cache compiler output (ccache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/.ccache
          key: ccache-asan-${{ hashFiles('**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-asan-${{ hashFiles('**/CMakeLists.txt') }}-
            ccache-asan-
      - name: Configure and build with ASan/UBSan
        # -fno-sanitize-recover: any undefined behaviour stops the program, so a test cannot pass over it
        # build number and build time are fixed so that ccache can reuse objects (nothing is shipped from here)
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          ccache --zero-stats
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DPINGMATOR_TESTS=ON -DBUILD_NUMBER=0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize -j 2
          ccache --show-stats
      - name: Run tests under sanitizers
        run: xvfb-run -a -s "-screen 0 1280x1000x24" ctest --test-dir build-sanitize --output-on-failure
      - name: Program starts and opens files (under sanitizers)
        run: xvfb-run -a -s "-screen 0 1280x1000x24" tests/smoke_gui.sh build-sanitize/src/pingmator
      - name: Remote control from start to finish (under sanitizers)
        run: xvfb-run -a -s "-screen 0 1280x1000x24" python3 tests/smoke_control.py build-sanitize/src/pingmator
