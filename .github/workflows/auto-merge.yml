name: Auto-merge

# Squash-merges open technical pull requests that carry the `auto-merge` label
# once every required check of main is green on their current head commit
# (the project owner's choice, 22 Nov 2026; docs/DECISIONS.md). The ruleset on
# main is unchanged and still decides what may be merged. The rules are in
# tools/ci/auto_merge.py (tests: tests/test_ci_auto_merge.py).
#
# Security: this workflow never checks out or runs a pull request's code. It
# checks out main only for the script and talks to the GitHub API.
on:
  # the label was added
  pull_request_target:
    types: [labeled]
  # checks finished: look again at every labelled pull request
  workflow_run:
    workflows: [Build, CodeQL, Privacy, Dependency review, Work board, Fuzz]
    types: [completed]
  # fallback sweep
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

# one run at a time, so the same pull request is never merged twice; a waiting
# run is replaced by a newer one, which sweeps all labelled pull requests anyway
concurrency:
  group: auto-merge
  cancel-in-progress: false

permissions: {}

jobs:
  auto-merge:
    # pull_request_target: only when the label just added is ours
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'auto-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # the squash merge
      pull-requests: write   # the squash merge
      checks: read           # check runs on the head commit
      statuses: read         # commit statuses on the head commit
      issues: read           # who added the label
      actions: write         # start Build (and Pages) on main after a merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main, never the pull request
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge labelled pull requests whose checks are green
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python3 tools/ci/auto_merge.py --pr "$PR_NUMBER"
          else
            python3 tools/ci/auto_merge.py
          fi
