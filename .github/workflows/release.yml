name: Release

# Builds the Windows zip and the Linux AppImage and publishes them as a
# GitHub release. The program's update check looks at these releases.
# The release tag is made by a person, never by this workflow: the ruleset
# "Protect release tags" does not let the Actions token create a v* tag.
# So: push the tag (git tag v0.3.0 && git push origin v0.3.0) and the checks and
# the release run from the tag. Or start it from the Actions tab (Release > Run
# workflow, type the version) on a commit that already has that tag: with
# publish off it only builds and checks and needs no tag.
#
# Every release first runs the full checks: the Build workflow (Linux tests,
# Windows build, sanitizers), CodeQL including the test code, and 10 minutes
# of fuzzing per target. The release is only published when all of them pass.
#
# Versions: 0.3.0 is a normal release. 0.3.0-beta.1 is a beta: it is
# published as a pre-release, which the update check in the program ignores.
# CMakeLists.txt, src/pinglymotion.rc and bin/NEWS hold the version without the
# -beta part (0.3.0).
#
# The build jobs only read the repository. Each writes a SHA256 checksum and
# a signed build provenance attestation for its file. The publish job is the
# only one that may write (create the release), and it runs no build steps.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 0.3.0 or 0.3.0-beta.1 (without -beta it must match CMakeLists.txt)'
        required: true
      publish:
        description: 'Publish the release (off = only build and check)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  QT_VERSION: '6.12.0'
  # tools for the AppImage, pinned to a release and checked by SHA-256
  LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  LINUXDEPLOY_QT_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
  LINUXDEPLOY_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the version in the code
        id: version
        shell: bash
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' || { echo "Not a version number: $VERSION (like 0.3.0 or 0.3.0-beta.1)"; exit 1; }
          BASE="${VERSION%%-*}"
          grep -q "PROJECT (pinglymotion VERSION $BASE)" CMakeLists.txt || { echo "CMakeLists.txt does not say version $BASE"; exit 1; }
          grep -q "\"$BASE.0\"" src/pinglymotion.rc || { echo "src/pinglymotion.rc does not say version $BASE.0"; exit 1; }
          grep -q "^Version $BASE\$" bin/NEWS || { echo "bin/NEWS has no entry for version $BASE"; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$BASE" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      # fail now, not after 40 minutes of builds, when the tag cannot be used
      - name: The tag exists and points at this commit
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          refs=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          [ -n "$refs" ] || { echo "The tag $TAG does not exist. Push it first (git tag $TAG && git push origin $TAG): the Actions token may not create release tags."; exit 1; }
          # an annotated tag lists the commit on the ^{} line, a plain tag on its own line
          commit=$(echo "$refs" | awk '/\^\{\}$/ {print $1} END {}' )
          [ -n "$commit" ] || commit=$(echo "$refs" | awk 'NR==1 {print $1}')
          [ "$commit" = "$GITHUB_SHA" ] || { echo "The tag $TAG points at $commit, but this run builds $GITHUB_SHA. Run it on the tagged commit."; exit 1; }

  windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # sign the build provenance
      attestations: write   # store the build provenance
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'  # Qt 6.12 repo layout; switch back to a PyPI release when one supports it
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: 'tools_mingw1310'
      - name: Build
        shell: bash
        run: |
          export PATH="$IQTA_TOOLS/mingw1310_64/bin:$PATH"
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_NUMBER=${{ github.run_number }} -DUPDATE_CHANNEL=2
          cmake --build build -j 4
      - name: Package
        shell: bash
        run: |
          export PATH="$IQTA_TOOLS/mingw1310_64/bin:$PATH"
          DIR="PinglyMotion-${TAG}-windows"
          mkdir -p "$DIR"
          cp build/src/PinglyMotion.exe "$DIR/"
          cp -r bin/data "$DIR/data"
          cp bin/NEWS LICENSE "$DIR/"
          # the MCP server goes with the program, so both are updated together
          mkdir -p "$DIR/mcp"
          cp tools/mcp/pinglymotion_mcp.py tools/mcp/commands.json tools/mcp/README.txt docs/ASSISTANT_GUIDE.md "$DIR/mcp/"
          # the Claude Desktop extension: in the zip and as its own download (issue #7)
          python tools/mcp/build_mcpb.py PinglyMotion.mcpb
          cp PinglyMotion.mcpb "$DIR/"
          cp "tools/mcp/START_HERE_CLAUDE.txt" "$DIR/START HERE - Claude.txt"
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations "$DIR/PinglyMotion.exe"
          cp "$IQTA_TOOLS"/mingw1310_64/bin/{libgcc_s_seh-1,libstdc++-6,libwinpthread-1}.dll "$DIR/"
          7z a "$DIR.zip" "$DIR"
          sha256sum "$DIR.zip" PinglyMotion.mcpb > SHA256SUMS-windows && cat SHA256SUMS-windows
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            PinglyMotion-${{ env.TAG }}-windows.zip
            PinglyMotion.mcpb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            PinglyMotion-${{ env.TAG }}-windows.zip
            PinglyMotion.mcpb
            SHA256SUMS-windows
          retention-days: 7

  linux:
    needs: version
    # the oldest supported Ubuntu, so the AppImage runs on older systems too
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write       # sign the build provenance
      attestations: write   # store the build provenance
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libfuse2 imagemagick
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'  # Qt 6.12 repo layout; switch back to a PyPI release when one supports it
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_NUMBER=${{ github.run_number }} -DUPDATE_CHANNEL=2
          cmake --build build -j 4
      - name: Download AppImage tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o linuxdeploy-x86_64.AppImage "$LINUXDEPLOY_URL"
          curl -fsSL -o linuxdeploy-plugin-qt-x86_64.AppImage "$LINUXDEPLOY_QT_URL"
          sha256sum linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          if [ -n "$LINUXDEPLOY_SHA256" ]; then
            echo "$LINUXDEPLOY_SHA256  linuxdeploy-x86_64.AppImage" | sha256sum --check
            echo "$LINUXDEPLOY_QT_SHA256  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum --check
          elif [ "${{ inputs.publish }}" != "false" ]; then
            echo "The AppImage tools have no pinned SHA-256 yet: run once with publish off and copy the sums above into release.yml"
            exit 1
          fi
          chmod +x *.AppImage
      - name: Package
        run: |
          # the program reads data/ and NEWS next to itself
          APPDIR="$RUNNER_TEMP/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp build/src/PinglyMotion "$APPDIR/usr/bin/"
          cp -r bin/data "$APPDIR/usr/bin/data"
          cp bin/NEWS LICENSE "$APPDIR/usr/bin/"
          mkdir -p "$APPDIR/usr/bin/mcp"
          cp tools/mcp/pinglymotion_mcp.py tools/mcp/commands.json tools/mcp/README.txt docs/ASSISTANT_GUIDE.md "$APPDIR/usr/bin/mcp/"
          # the Windows icon is 32x32; scaled up for the desktop
          convert "src/icons/pinglymotion.ico[0]" -filter point -resize 256x256 \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/pinglymotion.png"
          cat > "$APPDIR/usr/share/applications/pinglymotion.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PinglyMotion
          Comment=Animation editor for Second Life
          Exec=PinglyMotion %f
          Icon=pinglymotion
          Categories=Graphics;3DGraphics;
          MimeType=application/x-bvh;
          Terminal=false
          EOF
          sed -i 's/^ *//' "$APPDIR/usr/share/applications/pinglymotion.desktop"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          export OUTPUT="PinglyMotion-${TAG}-linux-x86_64.AppImage"
          "$RUNNER_TEMP/tools/linuxdeploy-x86_64.AppImage" --appdir "$APPDIR" \
            --desktop-file "$APPDIR/usr/share/applications/pinglymotion.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/pinglymotion.png" \
            --plugin qt --output appimage
          ls -la "$OUTPUT"
          sha256sum "$OUTPUT" > SHA256SUMS-linux && cat SHA256SUMS-linux
      - name: Starts and stays up
        run: |
          sudo apt-get install -y xvfb
          chmod +x "PinglyMotion-${TAG}-linux-x86_64.AppImage"
          cd "$RUNNER_TEMP"
          set +e
          QT_QPA_PLATFORM=xcb timeout 10 xvfb-run -a "$GITHUB_WORKSPACE/PinglyMotion-${TAG}-linux-x86_64.AppImage" > run.log 2>&1
          CODE=$?
          set -e
          tail -20 run.log
          [ $CODE -eq 124 ] || { echo "The AppImage stopped with exit code $CODE"; exit 1; }
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: PinglyMotion-${{ env.TAG }}-linux-x86_64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            PinglyMotion-${{ env.TAG }}-linux-x86_64.AppImage
            SHA256SUMS-linux
          retention-days: 7

  # the full checks; publish waits for them
  checks-build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
  checks-codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write   # upload the CodeQL results
  checks-fuzz:
    uses: ./.github/workflows/fuzz.yml
    permissions:
      contents: read

  publish:
    needs: [version, windows, linux, checks-build, checks-codeql, checks-fuzz]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    env:
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - name: Check the checksums
        run: |
          cat SHA256SUMS-windows SHA256SUMS-linux > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        run: |
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $FLAGS \
            "PinglyMotion-${TAG}-windows.zip" PinglyMotion.mcpb "PinglyMotion-${TAG}-linux-x86_64.AppImage" SHA256SUMS \
            --title "PinglyMotion ${TAG#v}" --generate-notes
