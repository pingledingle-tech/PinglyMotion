name: RLV scenarios

# Runs the RLV scenario files (.rlvtest) and the reference answers (.rlvref) of a folder with the runners
# pinglymotion_rlvtest and pinglymotion_rlvref, built from the program's source (package E, docs/RLV_TOOLS_REPO.md).
# The runners need no window and no display: they use QtCore only. A broken expectation fails the run.
#
# Three ways to start it:
#  - on a pull request or a push to main that changes the template folder, the reference answers, the
#    scenarios or the runners (it runs on the template's own examples, rlv-tools-template/);
#  - by hand (workflow_dispatch);
#  - from another repository that holds a copy of the template (workflow_call), with `engine_ref` set to
#    a commit of PinglyMotion (pin it) and `folder` to where its scripts and scenarios are.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rlv-scenarios.yml'
      - 'rlv-tools-template/**'
      - 'reference/**'
      - 'scenarios/**'
      - 'tests/rlvtest/**'
      - 'src/scriptlab/rlv*'
      - 'src/scriptlab/labrecipe.*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlv-scenarios.yml'
      - 'rlv-tools-template/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      engine_ref:
        description: 'A commit (or tag) of the PinglyMotion repository to build the runners from'
        type: string
        required: true
      folder:
        description: 'The folder of the calling repository that holds scenarios/ and scripts/'
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  run:
    name: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
      # called from another repository: its own folder; started here: the template's own examples
      WORK_FOLDER: ${{ inputs.folder || 'rlv-tools-template' }}
    steps:
      - name: Check out the program (the runners are built from it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pingledingle-tech/PinglyMotion
          ref: ${{ inputs.engine_ref || github.sha }}
          path: engine
          persist-credentials: false
      - name: Check out the scenarios of the calling repository
        # started here, the program's checkout above already holds them
        if: ${{ inputs.engine_ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: work
          persist-credentials: false
      - name: Where the scenarios are
        run: |
          if [ -d work ]; then echo "SCENARIO_ROOT=$GITHUB_WORKSPACE/work/$WORK_FOLDER" >> "$GITHUB_ENV"
          else echo "SCENARIO_ROOT=$GITHUB_WORKSPACE/engine/$WORK_FOLDER" >> "$GITHUB_ENV"; fi
      - name: Cache downloaded apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/apt-archives
          key: apt-rlv-scenarios-${{ hashFiles('.github/workflows/rlv-scenarios.yml') }}
          restore-keys: apt-rlv-scenarios-
      - name: Install Qt 6
        run: |
          mkdir -p /home/runner/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives=/home/runner/apt-archives ccache qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-l10n-tools libqt6opengl6-dev libgl-dev glslang-tools xvfb
          sudo chown -R "$USER" /home/runner/apt-archives
      - name: Cache compiler output (ccache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.ccache
          key: ccache-rlv-scenarios-${{ hashFiles('engine/**/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-rlv-scenarios-${{ hashFiles('engine/**/CMakeLists.txt') }}-
            ccache-rlv-scenarios-
      - name: Build the two runners (only these targets)
        working-directory: engine
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          ccache --zero-stats
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_NUMBER=0 -DPINGLYMOTION_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target pinglymotion_rlvtest pinglymotion_rlvref -j 4
          ccache --show-stats
      - name: Trial, no window - the runner starts with no display at all
        # package E, step 1: the answer to "does it start without a window on a hosted runner"
        working-directory: engine
        run: |
          unset DISPLAY QT_QPA_PLATFORM WAYLAND_DISPLAY
          echo "DISPLAY is '${DISPLAY:-}', QT_QPA_PLATFORM is '${QT_QPA_PLATFORM:-}'"
          build/tests/rlvtest/pinglymotion_rlvtest scenarios
      - name: Trial, no window - the same under a virtual screen (Xvfb), as the program's own CI does
        working-directory: engine
        run: xvfb-run -a build/tests/rlvtest/pinglymotion_rlvtest scenarios
      - name: Run every scenario (the first broken expectation fails the run)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rlv-results"
          unset DISPLAY QT_QPA_PLATFORM WAYLAND_DISPLAY
          RUNNER="$GITHUB_WORKSPACE/engine/build/tests/rlvtest/pinglymotion_rlvtest"
          cd "$SCENARIO_ROOT"
          if [ -d scripts ]; then "$RUNNER" --objects scripts scenarios; else "$RUNNER" scenarios; fi | tee "$RUNNER_TEMP/rlv-results/1-scenarios.txt"
      - name: Run the passing examples, if the folder has any
        run: |
          unset DISPLAY QT_QPA_PLATFORM WAYLAND_DISPLAY
          cd "$SCENARIO_ROOT"
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rlv-results"
          if [ -d examples/passing ]; then "$GITHUB_WORKSPACE/engine/build/tests/rlvtest/pinglymotion_rlvtest" examples/passing; else echo "No examples/passing: nothing to run."; fi | tee "$RUNNER_TEMP/rlv-results/2-passing-examples.txt"
      - name: The failing examples must fail
        # examples/failing holds scenarios that are meant to break; a run that passes one of them is the failure
        run: |
          unset DISPLAY QT_QPA_PLATFORM WAYLAND_DISPLAY
          cd "$SCENARIO_ROOT"
          mkdir -p "$RUNNER_TEMP/rlv-results"
          out="$RUNNER_TEMP/rlv-results/3-failing-examples.txt"
          : > "$out"
          if [ ! -d examples/failing ]; then echo "No examples/failing: nothing to check." | tee "$out"; exit 0; fi
          count=0
          for f in examples/failing/*.rlvtest; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            if "$GITHUB_WORKSPACE/engine/build/tests/rlvtest/pinglymotion_rlvtest" "$f" > /tmp/failing.out; then
              cat /tmp/failing.out
              echo "FAIL $f was meant to fail, but it passed." >> "$out"
              echo "::error::$f was meant to fail, but it passed."
              exit 1
            fi
            { echo "$f failed, as meant:"; sed 's/^/    /' /tmp/failing.out; } | tee -a "$out"
          done
          echo "$count failing example(s) failed, as meant." | tee -a "$out"
      - name: Run the reference answers, if the folder has any
        run: |
          unset DISPLAY QT_QPA_PLATFORM WAYLAND_DISPLAY
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/rlv-results"
          cd "$SCENARIO_ROOT"
          if ls reference/*.rlvref >/dev/null 2>&1; then
            "$GITHUB_WORKSPACE/engine/build/tests/rlvtest/pinglymotion_rlvref" reference
          else
            echo "No reference answers in $WORK_FOLDER/reference: nothing to compare."
          fi | tee "$RUNNER_TEMP/rlv-results/4-reference-answers.txt"
      - name: Summary of the results (shown on the page of the run)
        # runs also after a failure, so the summary says which scenario broke and why
        if: ${{ always() }}
        run: |
          {
            echo "## RLV scenario results"
            echo
            echo "A pass here is a result in the sandbox, never a result in Second Life."
            for f in "$RUNNER_TEMP"/rlv-results/*.txt; do
              [ -e "$f" ] || { echo; echo "Nothing ran. See the log of the earlier steps."; break; }
              case "$(basename "$f")" in
                1-*) title="Scenarios";;
                2-*) title="Passing examples";;
                3-*) title="Failing examples (each must fail)";;
                *) title="Reference answers";;
              esac
              echo
              echo "### $title"
              echo
              if grep -Eq '^(FAIL|NEW|BROKEN|STALE)' "$f"; then echo "Something broke. The lines that start with FAIL, NEW, BROKEN or STALE say what."; else echo "Nothing broke."; fi
              echo
              echo '```text'
              head -c 100000 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
